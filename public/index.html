<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chat nội bộ</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ===== AUTH (login / register) ===== -->
<section id="view-auth" class="view center-view hidden">
  <div class="card">
    <div class="brand">
      <div class="brand-dot"></div>
      <h1>Chat nội bộ</h1>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Đăng nhập</button>
      <button class="tab-btn" data-tab="register">Đăng ký</button>
    </div>

    <form id="form-login" class="tab-panel">
      <label>Tên đăng nhập</label>
      <input id="login-username" autocomplete="username" required>
      <label>Mật khẩu</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Đăng nhập</button>
      <p class="error" id="login-error"></p>
    </form>

    <form id="form-register" class="tab-panel hidden">
      <label>Tên đăng nhập</label>
      <input id="reg-username" autocomplete="username" required>
      <label>Mật khẩu (tối thiểu 6 ký tự)</label>
      <input id="reg-password" type="password" autocomplete="new-password" required>
      <button type="submit" class="btn-primary">Đăng ký</button>
      <p class="hint">Sau khi đăng ký, quản trị viên (admin) cần cấp quyền trước khi bạn xem được nội dung.</p>
      <p class="error" id="register-error"></p>
    </form>
  </div>
</section>

<!-- ===== PENDING (chưa được duyệt) ===== -->
<section id="view-pending" class="view center-view hidden">
  <div class="card">
    <div class="brand"><div class="brand-dot dot-amber"></div><h1>Đang chờ duyệt</h1></div>
    <p class="hint">Tài khoản <b id="pending-username"></b> đã đăng ký thành công nhưng chưa được admin cấp quyền
      xem nội dung / chat. Vui lòng liên hệ quản trị viên.</p>
    <button id="btn-pending-refresh" class="btn-secondary">Kiểm tra lại</button>
    <button id="btn-pending-logout" class="btn-ghost">Đăng xuất</button>
  </div>
</section>

<!-- ===== CHAT ===== -->
<section id="view-chat" class="view hidden">
  <header class="chat-header">
    <div class="brand small">
      <div class="brand-dot"></div>
      <span>Chat nội bộ</span>
      <span id="badge-unread" class="badge hidden">0</span>
    </div>
    <div class="header-actions">
      <span id="chat-username" class="me-username"></span>
      <button id="btn-admin" class="btn-icon hidden" title="Quản trị">⚙</button>
      <button id="btn-logout" class="btn-icon" title="Đăng xuất">⏻</button>
    </div>
  </header>

  <div id="messages" class="messages"></div>
  <button id="btn-load-more" class="btn-loadmore hidden">Tải tin nhắn cũ hơn</button>

  <div id="mention-dropdown" class="mention-dropdown hidden"></div>
  <div id="emoji-picker" class="emoji-picker hidden"></div>

  <div id="reply-preview" class="reply-preview hidden">
    <div class="reply-preview-info">
      <span class="reply-preview-label">Đang trả lời</span>
      <span id="reply-preview-sender" class="reply-preview-sender"></span>
      <span id="reply-preview-text" class="reply-preview-text"></span>
    </div>
    <button type="button" id="btn-cancel-reply" class="btn-ghost small">Hủy</button>
  </div>

  <!-- Attachment card: preview LOCAL (chua gui cho ai) cua 1 file dang duoc
       xu ly/tai len (anh/video/HEIC) - xem attachment-state.js + app.js
       renderAttachmentPreview(). Chi hien khi co dinh kem dang xu ly - nam
       TREN composer, giong reply-preview, de khong che nut Gui/input tren
       man hinh nho (mobile). -->
  <div id="attachment-card" class="attachment-card hidden">
    <div class="attachment-preview-wrap">
      <img id="attachment-preview-img" class="attachment-preview-img hidden" alt="">
      <div id="attachment-placeholder" class="attachment-placeholder hidden">
        <span id="attachment-placeholder-label" class="attachment-placeholder-label"></span>
      </div>
      <div id="attachment-overlay" class="attachment-overlay hidden">
        <svg class="attachment-spinner" id="attachment-spinner" viewBox="0 0 48 48" aria-hidden="true">
          <circle class="attachment-spinner-track" cx="24" cy="24" r="20"></circle>
          <circle id="attachment-spinner-arc" class="attachment-spinner-arc" cx="24" cy="24" r="20"></circle>
        </svg>
        <span id="attachment-progress-text" class="attachment-progress-text"></span>
      </div>
      <button type="button" id="btn-remove-attachment" class="attachment-remove" title="Xóa đính kèm">✕</button>
    </div>
    <div class="attachment-info">
      <span id="attachment-filename" class="attachment-filename"></span>
      <span id="attachment-status" class="attachment-status"></span>
    </div>
  </div>

  <form id="form-send" class="composer">
    <button type="button" id="btn-emoji" class="btn-icon" title="Gửi cảm xúc">😊</button>
    <button type="button" id="btn-attach" class="btn-icon" title="Gửi ảnh/video">📎</button>
    <input type="file" id="file-input" accept="image/*,video/*,.heic,.heif" class="hidden">
    <input type="text" id="text-input" placeholder="Nhập tin nhắn... (dùng @ để tag)" autocomplete="off">
    <button type="submit" class="btn-primary btn-send">Gửi</button>
  </form>
</section>

<!-- ===== Submenu chuột phải / giữ trên bong bóng chat (Trả lời / Xóa) ===== -->
<div id="context-menu" class="context-menu hidden"></div>

<!-- ===== Lightbox xem ảnh/video phóng to giữa màn hình ===== -->
<div id="media-lightbox" class="media-lightbox hidden">
  <button type="button" id="btn-lightbox-close" class="lightbox-close" title="Đóng">✕</button>
  <div id="lightbox-content" class="lightbox-content"></div>
</div>

<!-- ===== ADMIN PANEL ===== -->
<section id="view-admin" class="view hidden">
  <header class="chat-header">
    <div class="brand small"><div class="brand-dot"></div><span>Quản trị người dùng</span></div>
    <div class="header-actions">
      <button id="btn-admin-close" class="btn-icon" title="Đóng">✕</button>
    </div>
  </header>
  <div id="admin-list" class="admin-list"></div>
</section>

<div id="toast" class="toast hidden"></div>

<!-- HEIC/HEIF -> JPEG o phia client (uu tien - xem app.js convertHeicClientSide()).
     Neu CDN khong tai duoc (offline/chan mang) hoac bi CSP chan (vd 'unsafe-eval'
     can cho new Function() noi bo cua thu vien), app.js tu phat hien that bai/
     timeout va rot xuong gui HEIC goc len server de server tu convert - KHONG
     bao gio noi CSP cua app nay len de "sua" loi cua 1 thu vien ben thu 3. -->
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="/attachment-state.js"></script>
<script src="/app.js"></script>
</body>
</html>
